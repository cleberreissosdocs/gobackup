# GoBackup Agent — deploy stack (one process: web UI + embedded heartbeat,
# plus its own Postgres), to run on each protected server.
#
# As of this version the heartbeat runs INSIDE the "serve" process and its
# Central URL/CA/token are configured from the web UI's "Configurações"
# page (no -central flag needed at startup) — see the README.
#
# Usage:
#   1. cp .env.agent.example .env.agent   (edit POSTGRES_PASSWORD at least)
#   2. docker compose -f docker-compose.agent.yml --env-file .env.agent up -d --build postgres
#   3. docker compose -f docker-compose.agent.yml --env-file .env.agent run --rm agent \
#        migrate -db "postgres://gobackup:***@postgres:5432/gobackup?sslmode=disable"
#   4. docker compose -f docker-compose.agent.yml --env-file .env.agent run --rm agent \
#        create-user -db "postgres://gobackup:***@postgres:5432/gobackup?sslmode=disable" \
#        -email admin -password <escolha>
#   5. docker compose -f docker-compose.agent.yml --env-file .env.agent up -d
#   6. Open https://<este-servidor>:8081/, faça login, e em "Configurações"
#      aponte para a URL do Central e cole o certificado CA dele.
#
# Mount whatever host directories you want backed up under /backups — paths
# you type into the web UI or CLI (-source/-dest) must be the IN-CONTAINER
# path, e.g. /backups/www.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gobackup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.agent}
      POSTGRES_DB: gobackup
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobackup"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    # Fixed hostname: EnsureDefaultTenantAndAgent keys the agent's identity
    # (and thus every job definition) by hostname — without this, every
    # container recreation would get Docker's random hostname and silently
    # orphan all previously created jobs under a "new" agent identity.
    # Change this per server if you run more than one agent container.
    hostname: ${AGENT_HOSTNAME:-gobackup-agent}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.agent}
    command:
      - serve
      - -db=postgres://gobackup:${POSTGRES_PASSWORD}@postgres:5432/gobackup?sslmode=disable
      - -addr=:8081
      - -heartbeat-interval=${HEARTBEAT_INTERVAL:-1s}
    ports:
      - "${AGENT_WEB_PORT:-8081}:8081"
    volumes:
      - agent_data:/data
      - ${BACKUP_SOURCE_DIR:-./backups}:/backups
      - ${SSH_KEY_DIR:-./ssh-keys}:/ssh-keys:ro

volumes:
  agent_pg_data:
  agent_data:
