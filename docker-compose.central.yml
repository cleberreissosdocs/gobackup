# GoBackup Central — deploy stack (central app + its own Postgres).
# Usage:
#   1. cp .env.central.example .env.central  (edit values)
#   2. docker compose -f docker-compose.central.yml --env-file .env.central up -d --build
#   3. docker compose -f docker-compose.central.yml exec central gobackup-central migrate -db "postgres://gobackup:***@postgres:5432/gobackup?sslmode=disable"
#
# The admin/admin login is created automatically on first start (inside
# "serve", once the schema exists) — change the password in Usuários.
#
# The Central's self-signed TLS cert (needed by every agent as -central-ca)
# is written to the tls_data volume; copy it out with:
#   docker compose -f docker-compose.central.yml cp central:/data/gobackup-central-cert.pem ./gobackup-central-cert.pem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gobackup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.central}
      POSTGRES_DB: gobackup
    volumes:
      - central_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobackup"]
      interval: 5s
      timeout: 5s
      retries: 10

  central:
    build:
      context: .
      dockerfile: Dockerfile.central
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.central}
      # Timestamps in the web UI are rendered in the CONTAINER's local
      # zone, and a container with no TZ set runs in UTC — silently
      # putting every hour on screen 3 hours ahead of a Brazilian
      # operator. The image installs tzdata, so naming a zone is enough;
      # override TZ in the .env file for a different region.
      TZ: ${TZ:-America/Sao_Paulo}
    command:
      - serve
      - -db=postgres://gobackup:${POSTGRES_PASSWORD}@postgres:5432/gobackup?sslmode=disable
      - -addr=:61443
      - -tls-hosts=${TLS_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${CENTRAL_PORT:-61443}:61443"
    volumes:
      - central_tls:/data

volumes:
  central_pg_data:
  central_tls:
